{% extends "base.html" %}
{% block title %}Edit User — ValuNest{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
  <div class="breadcrumb"><a href="{{ url_for('admin_dashboard') }}" style="color:#2563eb;">Admin Dashboard</a> › <span>Edit User</span></div>
  <h1 style="color:#0f172a;">Edit User Account</h1>
  <p class="subtitle">Update account details, role status, or reset credentials</p>
  <form method="post" style="background:#ffffff;border:1.5px solid #bfdbfe;border-radius:18px;padding:26px;box-shadow:0 4px 16px rgba(37,99,235,0.05);">
    <div class="form-group">
      <label style="color:#1e3a8a;font-weight:600;">Full Name</label>
      <input type="text" name="name" value="{{ user['name'] }}" required style="border-color:#bfdbfe;">
    </div>
    <div class="form-group">
      <label style="color:#1e3a8a;font-weight:600;">Email Address</label>
      <input type="email" name="email" value="{{ user['email'] }}" required style="border-color:#bfdbfe;">
    </div>
    <div class="form-group">
      <label style="color:#1e3a8a;font-weight:600;">Account Status</label>
      <select name="status" style="border-color:#bfdbfe;">
        <option value="active" {% if user['status']=='active' %}selected{% endif %}>Active</option>
        <option value="blocked" {% if user['status']=='blocked' %}selected{% endif %}>Blocked</option>
      </select>
    </div>
    <div class="form-group">
      <label style="color:#1e3a8a;font-weight:600;">New Password <span style="font-weight:normal;color:#64748b;">(leave blank to keep current)</span></label>
      <input type="password" name="password" placeholder="Enter new password to change" style="border-color:#bfdbfe;">
    </div>
    <div style="display:flex;gap:12px;margin-top:16px;">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="flex:1;text-align:center;">← Cancel</a>
      <button type="submit" class="btn btn-primary" style="flex:2;background:linear-gradient(135deg, #1e40af, #2563eb);color:#ffffff;border:none;">Save Changes →</button>
    </div>
  </form>
</div>
{% endblock %}
