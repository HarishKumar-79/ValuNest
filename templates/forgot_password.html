{% extends "base.html" %}
{% block title %}Forgot Password — HomeFinder{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
      </div>
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-subtitle">Enter your email address and we'll send you a password reset link.</p>
    </div>

    <form method="post" class="auth-form" onsubmit="handleFormSubmit(this)">
      <div class="form-group">
        <label for="forgotEmail" class="form-label">Email address</label>
        <div class="input-wrapper">
          <input type="email" id="forgotEmail" name="email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full submit-btn">
        <span class="btn-text">Send reset link</span>
        <span class="btn-spinner"></span>
        <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="{{ url_for('login') }}" class="auth-link">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function handleFormSubmit(form) {
  const submitBtn = form.querySelector('.submit-btn');
  if (submitBtn) {
    submitBtn.classList.add('loading');
  }
}
</script>
{% endblock %}
