{% extends "base.html" %}
{% block title %}Edit Booking — ValuNest{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
  <div class="breadcrumb"><a href="{{ url_for('admin_dashboard') }}" style="color:#2563eb;">Admin Dashboard</a> › <span>Edit Booking</span></div>
  <h1 style="color:#0f172a;">Edit Booking #{{ booking['id'] }}</h1>
  <p class="subtitle">Modify booking parameters for {{ booking['user_name'] }}</p>
  <form method="post" style="background:#ffffff;border:1.5px solid #bfdbfe;border-radius:18px;padding:26px;box-shadow:0 4px 16px rgba(37,99,235,0.05);">
    <div class="form-row">
      <div class="form-group">
        <label style="color:#1e3a8a;font-weight:600;">City</label>
        <input type="text" name="city" value="{{ booking['city'] }}" required style="border-color:#bfdbfe;">
      </div>
      <div class="form-group">
        <label style="color:#1e3a8a;font-weight:600;">Locality</label>
        <input type="text" name="location" value="{{ booking['location'] }}" required style="border-color:#bfdbfe;">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label style="color:#1e3a8a;font-weight:600;">Price (₹)</label>
        <input type="number" name="price" value="{{ booking['price']|int }}" required style="border-color:#bfdbfe;">
      </div>
      <div class="form-group">
        <label style="color:#1e3a8a;font-weight:600;">Payment Method</label>
        <select name="payment_method" style="border-color:#bfdbfe;">
          <option {% if booking['payment_method']=='UPI' %}selected{% endif %}>UPI</option>
          <option {% if booking['payment_method']=='Net Banking' %}selected{% endif %}>Net Banking</option>
          <option {% if booking['payment_method']=='Credit / Debit Card' %}selected{% endif %}>Credit / Debit Card</option>
          <option {% if booking['payment_method']=='EMI' %}selected{% endif %}>EMI</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label style="color:#1e3a8a;font-weight:600;">Booking Status</label>
      <select name="status" style="border-color:#bfdbfe;">
        <option value="confirmed" {% if booking['status']=='confirmed' %}selected{% endif %}>Confirmed</option>
        <option value="cancelled" {% if booking['status']=='cancelled' %}selected{% endif %}>Cancelled</option>
        <option value="cart" {% if booking['status']=='cart' %}selected{% endif %}>In Cart</option>
      </select>
    </div>
    <div style="display:flex;gap:12px;margin-top:16px;">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="flex:1;text-align:center;">← Cancel</a>
      <button type="submit" class="btn btn-primary" style="flex:2;background:linear-gradient(135deg, #1e40af, #2563eb);color:#ffffff;border:none;">Save Changes →</button>
    </div>
  </form>
</div>
{% endblock %}
