{% extends "base.html" %}
{% block title %}Admin Portal — ValuNest{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: radial-gradient(circle at 50% 10%, #f5f3ff 0%, #f8fafc 80%);">
  <div class="auth-card" style="width: 100%; max-width: 440px; background: #ffffff; border-radius: 24px; border: 1.5px solid #c7d2fe; box-shadow: 0 24px 50px -15px rgba(99, 102, 241, 0.16), 0 4px 16px rgba(0, 0, 0, 0.04); padding: 40px 36px; position: relative; overflow: hidden;">
    
    <!-- Top Blue Accent -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #4338ca, #6366f1, #818cf8, #6366f1);"></div>

    <div class="auth-header" style="text-align: center; margin-bottom: 28px;">
      <div class="auth-brand-icon" style="width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 16px; background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); border: 1.5px solid #c7d2fe; display: flex; align-items: center; justify-content: center; color: #4338ca; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" style="width: 28px; height: 28px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
      <h1 class="auth-title heading-light-to-bright" style="font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 6px;">ValuNest Admin Portal</h1>
      <p class="auth-subtitle" style="color: #64748b; font-size: 13.5px; margin: 0;">Authorized administrator access only</p>
    </div>

    {% if firebase_enabled %}
    <div class="oauth-section" style="margin-bottom: 20px;">
      <button type="button" class="btn btn-oauth" onclick="signInWithGoogle('admin')" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid #c7d2fe; background: #ffffff; color: #1e293b; font-size: 14px; font-weight: 600; cursor: pointer;">
        <svg class="google-svg" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>
    <div class="auth-divider" style="display: flex; align-items: center; text-align: center; margin: 20px 0; color: #94a3b8; font-size: 13px;">
      <span style="flex: 1; border-bottom: 1px solid #e2e8f0;"></span>
      <span style="padding: 0 14px; font-weight: 500;">or admin credentials</span>
      <span style="flex: 1; border-bottom: 1px solid #e2e8f0;"></span>
    </div>
    {% endif %}

    <form method="post" class="auth-form" onsubmit="handleFormSubmit(this)">
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="adminEmail" class="form-label" style="display: block; font-size: 13.5px; font-weight: 600; color: #312e81; margin-bottom: 8px;">Admin Email</label>
        <div class="input-wrapper">
          <input type="email" id="adminEmail" name="email" class="form-input" placeholder="admin@house.com" required autocomplete="email" style="border-color: #c7d2fe; font-size: 14px;">
          <span class="input-icon" style="color: #6366f1;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="adminPwd" class="form-label" style="display: block; font-size: 13.5px; font-weight: 600; color: #312e81; margin-bottom: 8px;">Master Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPwd" name="password" class="form-input" placeholder="Admin password" required autocomplete="current-password" style="border-color: #c7d2fe; font-size: 14px;">
          <span class="input-icon" style="color: #6366f1;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 18px; height: 18px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full submit-btn" style="background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3); padding: 13px; font-size: 15px; font-weight: 700; border-radius: 12px; border: none; color: #ffffff; cursor: pointer;">
        <span class="btn-text">Sign in to Admin Dashboard</span>
        <span class="btn-spinner"></span>
        <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 18px; height: 18px; margin-left: 6px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </form>

    <div class="auth-footer" style="text-align: center; margin-top: 24px;">
      <a href="{{ url_for('login') }}" class="auth-link" style="color: #6366f1; font-size: 13.5px; font-weight: 600; text-decoration: none;">← Return to User Login</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function handleFormSubmit(form) {
  const submitBtn = form.querySelector('.submit-btn');
  if (submitBtn) {
    submitBtn.classList.add('loading');
  }
}
</script>
{% endblock %}
