{% extends "base.html" %}
{% block title %}Admin Panel — HomeFinder{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-icon" style="background: rgba(239, 68, 68, 0.1); color: var(--danger);">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
      <h1 class="auth-title">Admin Panel</h1>
      <p class="auth-subtitle">Sign in with admin credentials or approved Google account</p>
    </div>

    {% if firebase_enabled %}
    <div class="oauth-section">
      <button type="button" class="btn btn-oauth" onclick="signInWithGoogle('admin')">
        <svg class="google-svg" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>
    <div class="auth-divider">
      <span>or admin login</span>
    </div>
    {% endif %}

    <form method="post" class="auth-form" onsubmit="handleFormSubmit(this)">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Admin Email</label>
        <div class="input-wrapper">
          <input type="email" id="adminEmail" name="email" class="form-input" placeholder="admin@house.com" required autocomplete="email">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="adminPwd" class="form-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPwd" name="password" class="form-input" placeholder="Admin password" required autocomplete="current-password">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full submit-btn">
        <span class="btn-text">Sign in to Admin</span>
        <span class="btn-spinner"></span>
        <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('login') }}" class="auth-link">← Back to website</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function handleFormSubmit(form) {
  const submitBtn = form.querySelector('.submit-btn');
  if (submitBtn) {
    submitBtn.classList.add('loading');
  }
}
</script>
{% endblock %}
