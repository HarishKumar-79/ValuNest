{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
  <div class="breadcrumb"><a href="{{ url_for('admin_dashboard') }}" style="color:#43a047;">Admin</a> › <span>Edit User</span></div>
  <h1>Edit User</h1>
  <p class="subtitle">Update user details, status or reset password</p>
  <form method="post">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" value="{{ user['name'] }}" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" value="{{ user['email'] }}" required>
    </div>
    <div class="form-group">
      <label>Account Status</label>
      <select name="status">
        <option value="active" {% if user['status']=='active' %}selected{% endif %}>Active</option>
        <option value="blocked" {% if user['status']=='blocked' %}selected{% endif %}>Blocked</option>
      </select>
    </div>
    <div class="form-group">
      <label>New Password <span style="font-weight:normal;color:#aaa;">(leave blank to keep current)</span></label>
      <input type="password" name="password" placeholder="Enter new password to change">
    </div>
    <div style="display:flex;gap:12px;margin-top:8px;">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="flex:1;text-align:center;">← Back</a>
      <button type="submit" class="btn btn-green" style="flex:2;">Save Changes →</button>
    </div>
  </form>
</div>
{% endblock %}
