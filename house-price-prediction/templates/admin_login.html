{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="container narrow" style="margin-top:60px;">
  <div style="text-align:center;margin-bottom:24px;">
    <div style="font-size:40px;margin-bottom:8px;">🔐</div>
    <h1>Admin Panel</h1>
    <p class="subtitle">Sign in with admin credentials</p>
  </div>
  <form method="post">
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" name="email" placeholder="admin@house.com" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Admin password" required>
    </div>
    <button type="submit" class="btn btn-full" style="margin-top:8px;">Sign in →</button>
  </form>
  <div style="text-align:center;margin-top:16px;">
    <a href="{{ url_for('login') }}" class="btn btn-secondary" style="padding:10px 28px;">← Back to website</a>
  </div>
</div>
{% endblock %}
